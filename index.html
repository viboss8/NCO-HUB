/* AGSU-inspired Pinks and Greens theme, visual-only update for fictional demo. */
:root {
  --nav:#303b2d; --nav2:#46523b; --ink:#30372c; --muted:#766f61;
  --line:#ded7c8; --bg:#f5f1e8; --white:#fffdf8;
  --blue:#536746; --blue-soft:#ebefe4; --teal:#617851;
  --amber:#986d27; --red:#a44c43;
  --shadow:0 5px 22px rgba(51,54,38,.055);
}
body {background:var(--bg); color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible {outline-color:#b49a60}
.sidebar {background:linear-gradient(165deg,#303b2d 0%,#37442f 55%,#252f25 100%);color:#e9e4d7}

.sidebar-bottom {border-color:#687259}
.demo-label {border-color:#a49a72;color:#f0dfb5}
.sidebar-bottom p {color:#d0c9b3}
.topbar,.metric,.panel,.soldier,.met-card,.mission-card,.day-card,.tab,.btn,.search,.select {background:#fffdf9}
.topbar,.panel-head,.data-table td,.data-table th,.row-event,.list-row {border-color:var(--line)}
.crumb,.heading p,.panel-head small {color:var(--muted)}
.crumb strong,.btn,.time {color:#394634}

function federalHolidays(year){
 let out={};const add=(day,name)=>{out[day]=name};
 for(const y of [year-1,year,year+1]){
  [[0,1,"New Year's Day"],[5,19,"Juneteenth"],[6,4,"Independence Day"],[10,11,"Veterans Day"],[11,25,"Christmas Day"]].forEach(([m,d,name])=>{let day=observed(new Date(y,m,d,12));if(day.startsWith(String(year)))add(day,name)});

 }

}

function calendar(){
 const base=dateAt(today),activeMonth=new Date(base),firstOfWeek=new Date(base);
 activeMonth.setDate(1);activeMonth.setMonth(activeMonth.getMonth()+calendarOffset);
 firstOfWeek.setDate(firstOfWeek.getDate()-((firstOfWeek.getDay()+6)%7)+weekOffset*7);
 const y=activeMonth.getFullYear(),m=activeMonth.getMonth(),dayCount=new Date(y,m+1,0,12).getDate();
 const tabs='<div class="calendar-controls" role="group" aria-label="Calendar view"><button class="btn '+(calendarView==='week'?'primary':'')+'" data-act="calendar-week">Week</button><button class="btn '+(calendarView==='month'?'primary':'')+'" data-act="calendar-month">Month</button></div>';
 const monthDays=Array.from({length:dayCount},(_,i)=>{
  const d=dateKey(new Date(y,m,i+1,12)),holiday=dayOffLabel(d),weekend=!isWorkingDay(d);
  const events=state.events.filter(x=>spansDate(x,d)).length,train=state.training.filter(x=>spansDate(x,d)).length;

 }).join('');
 const monthTitle=activeMonth.toLocaleDateString('en-US',{month:'long',year:'numeric'});
 const monthLabel='<div class="panel"><div class="panel-head"><h2>'+monthTitle+'</h2><div class="action-row"><button class="btn tiny" data-act="month-prev" aria-label="Previous month">‹</button><button class="btn tiny" data-act="month-now">Today</button><button class="btn tiny" data-act="month-next" aria-label="Next month">›</button></div></div><div class="panel-body"><div class="month-grid">'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>'<div class="weekday">'+x+'</div>').join('')+Array((new Date(y,m,1,12).getDay()+6)%7).fill('<div class="month-day empty-day"></div>').join('')+monthDays+'</div></div></div>';
 const weekDates=Array.from({length:7},(_,i)=>{let d=new Date(firstOfWeek);d.setDate(d.getDate()+i);return dateKey(d)});
 const weekly=weekDates.map(d=>{
  const holiday=dayOffLabel(d),off=!isWorkingDay(d);
  let items=[
   ...state.events.filter(x=>spansDate(x,d)).map(x=>({type:'event',id:x.id,sort:x.time||'12:00',label:(x.time||'')+' '+x.title,sub:scheduleLabel(x,d)+' • '+(x.soldierIds||[]).map(who).join(', ')})),
   ...state.training.filter(x=>spansDate(x,d)).map(x=>({type:'training',id:x.id,sort:'09:00',label:x.title,sub:'Training • '+scheduleLabel(x,d)})),
   ...state.tasks.filter(x=>!x.done&&x.due===d).map(x=>({type:'task',id:x.id,sort:'16:00',label:x.title,sub:'Follow-up • '+who(x.soldierId)})),
   ...state.requirements.filter(x=>x.completion!=='Verified'&&x.due===d).map(x=>({type:'requirement',id:x.id,sort:'16:00',label:x.course,sub:'Requirement deadline • '+who(x.soldierId)})),
   ...state.prepPlans.filter(p=>spansDate(p,d)).map(p=>({type:'prep',id:p.id,sort:'09:00',label:p.title,sub:(p.soldierId?who(p.soldierId)+' • ':'')+scheduleLabel(p,d)+' • '+fmt(p.date)+(p.endDate&&p.endDate!==p.date?' to '+fmt(p.endDate):'')})),...state.prepPlans.flatMap(p=>(p.items||[]).filter(x=>!x.done&&x.due===d).map(x=>({type:'prep',id:p.id,sort:'16:00',label:x.title,sub:'Preparation • '+p.title})))
  ].sort((a,b)=>a.sort.localeCompare(b.sort));
  return '<section class="week-day '+(d===today?'is-today':'')+'"><div class="week-day-head"><strong>'+fmt(d,{weekday:'short',month:'short',day:'numeric'})+'</strong><span>'+(holiday?e(holiday):off?'Weekend':'Working day')+'</span></div>'+ (items.length?items.map(x=>'<button class="week-entry" data-act="'+x.type+'-detail" data-id="'+e(x.id)+'"><span>'+e(x.label)+'</span><small>'+e(x.sub)+'</small></button>').join(''):'<p class="week-empty">No commitments or deadlines</p>')+'</section>'
 }).join('');
 const weekLabel='<div class="panel"><div class="panel-head"><h2>'+fmt(weekDates[0],{month:'short',day:'numeric'})+' to '+fmt(weekDates[6],{month:'short',day:'numeric',year:'numeric'})+'</h2><div class="action-row"><button class="btn tiny" data-act="week-prev" aria-label="Previous week">‹</button><button class="btn tiny" data-act="week-now">Today</button><button class="btn tiny" data-act="week-next" aria-label="Next week">›</button></div></div><div class="panel-body"><div class="week-list">'+weekly+'</div></div></div>';

}

function validateRosterDoc(doc){
 if(!doc||doc.format!=='nco-hub-roster-v1'||!Array.isArray(doc.soldiers)||doc.soldiers.length===0||doc.soldiers.length>100)throw Error('Invalid roster format');
 const ids=new Set();
 const records=doc.soldiers.map(raw=>{
  if(!raw||typeof raw!=='object')throw Error('Invalid Soldier record');
  const id=String(raw.id||'').trim(),rank=String(raw.rank||'').trim(),last=String(raw.lastName||'').trim(),first=String(raw.firstName||'').trim(),role=String(raw.role||'').trim();
  if(!/^[a-zA-Z0-9_-]{1,40}$/.test(id)||ids.has(id)||!/^[A-Za-z0-9 ]{2,8}$/.test(rank)||!/^[A-Za-z][A-Za-z' -]{0,59}$/.test(last)||first.length>60||role.length>100)throw Error('Invalid or duplicate Soldier record');
  ids.add(id);
  return {id,rank,lastName:last,firstName:first,role,reportsTo:raw.reportsTo==null?null:String(raw.reportsTo),name:rank+' '+last,initials:last[0].toUpperCase(),goals:[]};
 });
 if(records.some(x=>x.reportsTo&&!ids.has(x.reportsTo)))throw Error('Reporting line references missing Soldier');
 for(const soldier of records){const seen=new Set([soldier.id]);let current=soldier;while(current.reportsTo){if(seen.has(current.reportsTo))throw Error('Circular reporting structure');seen.add(current.reportsTo);current=records.find(x=>x.id===current.reportsTo);if(!current)break}}
 return records;
}
function mergeRoster(records,sync=false){
 const existing=state.soldiers,used=new Set(existing.map(x=>x.id)),ids=new Map();
 records.forEach(r=>{
  const match=existing.find(x=>x.rank.toUpperCase()===r.rank.toUpperCase()&&(x.lastName||x.name.split(' ').slice(1).join(' ')).toUpperCase()===r.lastName.toUpperCase());
  const id=match?.id||(!used.has(r.id)?r.id:idNew());used.add(id);ids.set(r.id,id);
 });
 records.forEach(r=>{
  const id=ids.get(r.id),old=existing.find(x=>x.id===id);
  upsert('soldiers',{...r,id,active:true,reportsTo:r.reportsTo?ids.get(r.reportsTo)||null:null,firstName:r.firstName||old?.firstName||'',goals:old?.goals||[]});
 });
 let archived=0;
 if(sync){
  const activeIds=new Set(ids.values());
  for(const soldier of existing){
   if(!activeIds.has(soldier.id)&&soldier.active!==false){soldier.active=false;archived++;}
  }
 }
 save();render();return {imported:records.length,archived};
}
async function importRosterFile(file){
 if(!file)return;
 try{
  if(file.size>100000)throw Error('Roster import file too large');
  const doc=JSON.parse(await file.text()),records=validateRosterDoc(doc),sync=doc.syncActiveRoster===true;
  if(!confirm('Import '+records.length+' Soldier profiles and reporting relationships? '+(sync?'Other team members will be archived from active views, not deleted. ':'')+'Existing linked tasks and appointments will be preserved.'))return;
  const result=mergeRoster(records,sync);
  notify(result.imported+' Soldier profiles updated; '+result.archived+' former team members archived');
 }catch(err){notify(err.message||'Roster import failed')}
}
function upsert(k,o){let i=state[k].findIndex(x=>x.id===o.id);if(i<0)state[k].push(o);else state[k][i]=o}
document.addEventListener('click',ev=>{let el=ev.target.closest('[data-act]');if(!el)return;let a=el.dataset.act,id=el.dataset.id;if(el.type==='checkbox')return;if(a==='goto')route(id);else if(a==='calendar')route('calendar');else if(a==='metric-open'){if(id==='soldiers'){route('soldiers')}else{document.getElementById(id)?.scrollIntoView({behavior:'smooth',block:'start'})}}else if(a==='calendar-week'){calendarView='week';render()}else if(a==='calendar-month'){calendarView='month';render()}else if(a==='week-prev'){weekOffset--;render()}else if(a==='week-next'){weekOffset++;render()}else if(a==='week-now'){weekOffset=0;render()}else if(a==='calendar-day'){const d=dateAt(id),current=dateAt(today);const monday=x=>{let a=new Date(x);a.setDate(a.getDate()-((a.getDay()+6)%7));return a};weekOffset=Math.round((monday(d)-monday(current))/604800000);calendarView='week';render()}else if(a==='month-prev'){calendarOffset--;render()}else if(a==='month-next'){calendarOffset++;render()}else if(a==='month-now'){calendarOffset=0;render()}else if(a==='vault-setup'){if(localStorage.getItem(vaultStorageKey)){notify('An encrypted tracker is already configured. Use Encrypted Backup or Lock instead.');return;}vaultSetupOpen=true;render()}else if(a==='vault-cancel'){vaultSetupOpen=false;render()}else if(a==='vault-lock'){lockVault()}else if(a==='vault-backup'){downloadVault()}else if(a==='vault-restore'){document.getElementById('vault-file')?.click()}else if(a==='close'){drawer=null;render()}else if(a==='tab'){tab=id;render()}else if(a==='soldier-detail')open('soldier',id);else if(a==='edit-soldier')open('soldier-edit',id);else if(a==='new-soldier'){createFor='';open('soldier-edit','')}else if(a==='roster-import'){document.getElementById('roster-file')?.click()}else if(a==='edit-goals')open('goals',id);else if(a==='requirement-detail')open('requirement',id);else if(a==='task-detail')open('task',id);else if(a==='event-detail')open('event',id);else if(a==='training-detail')open('training',id);else if(a==='mission-detail')open('mission',id);else if(a==='met-detail')open('met',id);else if(a==='task-library')open('library');else if(a==='prep-detail')open('prep',id);else if(a==='prep-edit')open('prep-edit',id);else if(a==='quick-add'){createFor=sol(id)?id:'';quickCategory='task';open('quick-add','')}else if(a==='quick-start-wizard'){prepDraft={};wizardStep=1;wizardRows=1;open('prep-wizard','')}else if(a==='new-prep'){createFor=sol(id)?id:'';prepDraft={};wizardStep=1;wizardRows=1;open('prep-wizard','')}else if(a==='wizard-back'){wizardStep=Math.max(1,wizardStep-1);render()}else if(a==='wizard-add'){let form=document.querySelector('#wizard-form');if(form)prepDraft.items=wizardDraftRows(form);wizardRows=Math.min(wizardRows+1,10);render()}else if(a.startsWith('new-')){createFor=sol(id)?id:'';open(a.slice(4),'')}else if(a==='suggest-task'){upsert('tasks',{id:idNew(),title:'Verify training attendance',due:addDay(3),soldierId:'',done:false,note:'Created manually from a suggested follow-up',source:'manual'});save();render();notify('Follow-up added')}else if(a==='reset'){if(confirm('Clear all locally saved entries? This cannot be undone.')){state=initial();save();drawer=null;render();notify('Tracker cleared')}}});
document.addEventListener('change',ev=>{if(ev.target.id==='quick-category'){quickCategory=ev.target.value;render();return}});
document.addEventListener('change',ev=>{let el=ev.target;if(el.dataset.act==='prep-toggle'){let p=state.prepPlans.find(x=>x.id===el.dataset.id),item=p?.items.find(x=>x.id===el.dataset.item);if(item){item.done=el.checked;save();render();notify('Preparation requirement updated, course completion unchanged.')}return;}if(el.dataset.act==='toggle-task'){let t=state.tasks.find(t=>t.id===el.dataset.id);if(t){t.done=el.checked;save();render();notify('Task updated. Related training status was not changed.')}}});
document.addEventListener('input',ev=>{if(ev.target.id==='search'){filter=ev.target.value;let pos=ev.target.selectionStart;render();let target=document.querySelector('#search');target?.focus();target?.setSelectionRange(pos,pos)}});
function showWizardError(field,message){
 if(!field)return notify(message);
 const msg=document.createElement('p');msg.className='wizard-error';msg.setAttribute('role','alert');msg.textContent=message;
 field.closest('.field')?.appendChild(msg);
 field.setAttribute('aria-invalid','true');
 field.focus();
}
document.addEventListener('input',ev=>{if(ev.target.closest('#wizard-form')){ev.target.removeAttribute('aria-invalid');ev.target.closest('.field')?.querySelector('.wizard-error')?.remove();if(ev.target.hasAttribute('data-prep-mode')||ev.target.name.startsWith('itemdue'))updatePrepPreview(ev.target.closest('form'));}});
document.addEventListener('change',ev=>{if(ev.target.hasAttribute('data-prep-mode'))updatePrepPreview(ev.target.closest('form'));});
document.addEventListener('submit',ev=>{if(ev.target.id==='vault-setup-form'){ev.preventDefault();const f=Object.fromEntries(new FormData(ev.target).entries());if(f.pass!==f.confirm){notify('Passphrases do not match.');return;}createVault(f.pass);return;}if(ev.target.id==='vault-unlock-form'){ev.preventDefault();unlockVault(new FormData(ev.target).get('passphrase')||'');return;}if(ev.target.id==='wizard-form'){ev.preventDefault();let f=Object.fromEntries(new FormData(ev.target).entries());if(wizardStep===1){
 const nameField=ev.target.querySelector('[name="title"]');
 const dateField=ev.target.querySelector('[name="date"]');
 const title=(f.title||'').trim(), date=(f.date||'').trim(), endDate=(f.endDate||date).trim();
 ev.target.querySelectorAll('.wizard-error').forEach(el=>el.remove());
 if(!title){showWizardError(nameField,'Enter a name for this training or event.');return;}
 if(!date||!/^\d{4}-\d{2}-\d{2}$/.test(date)||Number.isNaN(Date.parse(date))){showWizardError(dateField,'Select a valid start date.');return;}
 if(!/^\d{4}-\d{2}-\d{2}$/.test(endDate)||endDate<date){showWizardError(ev.target.querySelector('[name="endDate"]'),'End date must be on or after the start date.');return;}prepDraft={...prepDraft,title,type:f.type,soldierId:f.soldierId||'',date,endDate};wizardStep=2;render();
}
else if(wizardStep===2){prepDraft.hasPrep=f.hasPrep;if(f.hasPrep==='no'){state.prepPlans.push({id:idNew(),...prepDraft,items:[]});save();drawer=null;render();notify('Event saved without prerequisites');}else{wizardStep=3;render();}}
else{let items=Array.from({length:wizardRows},(_,i)=>{let mode=f['itemmode'+i]||'3',title=(f['itemtitle'+i]||'').trim(),due=prepDeadline(prepDraft.date,mode,f['itemdue'+i]||'');return {id:idNew(),title,mode,due,owner:f['itemowner'+i]||'NCO',done:false}}).filter(x=>x.title);if(!items.length){notify('Enter at least one prerequisite.');return;}if(items.some(x=>!x.due||x.due>prepDraft.date)){notify('Every requirement needs a deadline no later than the event.');return;}state.prepPlans.push({id:idNew(),...prepDraft,items});save();drawer=null;render();notify('Event and preparation checklist saved');}return;}
if(ev.target.id==='entity-form'){ev.preventDefault();formSave(ev.target)}});
document.addEventListener('change',ev=>{if(ev.target.id==='vault-file'){restoreVaultFile(ev.target.files?.[0]);}if(ev.target.id==='roster-file'){importRosterFile(ev.target.files?.[0]);}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&drawer){drawer=null;render()}});
document.addEventListener('click',ev=>{if(ev.target.id==='overlay'){drawer=null;render()}});
render();
</script>
</body>
</html>

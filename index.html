/* AGSU-inspired Pinks and Greens theme, visual-only update for fictional demo. */
:root {
  --nav:#303b2d; --nav2:#46523b; --ink:#30372c; --muted:#766f61;
  --line:#ded7c8; --bg:#f5f1e8; --white:#fffdf8;
  --blue:#536746; --blue-soft:#ebefe4; --teal:#617851;
  --amber:#986d27; --red:#a44c43;
  --shadow:0 5px 22px rgba(51,54,38,.055);
}
body {background:var(--bg); color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible {outline-color:#b49a60}
.sidebar {background:linear-gradient(165deg,#303b2d 0%,#37442f 55%,#252f25 100%);color:#e9e4d7}

.sidebar-bottom {border-color:#687259}
.demo-label {border-color:#a49a72;color:#f0dfb5}
.sidebar-bottom p {color:#d0c9b3}
.topbar,.metric,.panel,.soldier,.met-card,.mission-card,.day-card,.tab,.btn,.search,.select {background:#fffdf9}
.topbar,.panel-head,.data-table td,.data-table th,.row-event,.list-row {border-color:var(--line)}
.crumb,.heading p,.panel-head small {color:var(--muted)}
.crumb strong,.btn,.time {color:#394634}

async function deriveVaultKey(pass,salt){const base=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function sealedSnapshot(snapshot,keyToUse,saltToUse){const iv=crypto.getRandomValues(new Uint8Array(12)),cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},keyToUse,enc.encode(snapshot));return JSON.stringify({version:1,kdf:'PBKDF2-SHA256',iterations:250000,salt:b64(saltToUse),iv:b64(iv),ciphertext:b64(new Uint8Array(cipher))})}
function validVault(v){return v&&v.version===1&&v.kdf==='PBKDF2-SHA256'&&v.iterations===250000&&typeof v.salt==='string'&&typeof v.iv==='string'&&typeof v.ciphertext==='string'}
function validTracker(v){return v&&['soldiers','events','requirements','training','missions','tasks','prepPlans','met'].every(k=>Array.isArray(v[k]))}
async function unlockVault(pass){try{const v=JSON.parse(localStorage.getItem(vaultStorageKey)||'null');if(!validVault(v))throw Error('Invalid vault');const salt=bytesFrom64(v.salt),candidate=await deriveVaultKey(pass,salt);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytesFrom64(v.iv)},candidate,bytesFrom64(v.ciphertext));const decoded=JSON.parse(dec.decode(pt));if(!validTracker(decoded))throw Error('Invalid tracker data');state=decoded;vaultKey=candidate;vaultSalt=salt;render();notify('Tracker unlocked');return true}catch(err){notify('Unable to unlock. Check the passphrase or backup.');return false}}
async function createVault(pass){if(typeof crypto==='undefined'||!crypto.subtle){notify('Secure storage requires HTTPS and browser encryption support.');return}
 if(pass.length<12){notify('Use at least 12 characters for your passphrase.');return}
 if(localStorage.getItem(vaultStorageKey)){notify('A protected tracker already exists. Unlock it instead.');return}
 try{let salt=crypto.getRandomValues(new Uint8Array(16)),candidate=await deriveVaultKey(pass,salt),blob=await sealedSnapshot(JSON.stringify(state),candidate,salt);localStorage.setItem(vaultStorageKey,blob);localStorage.removeItem(key);vaultKey=candidate;vaultSalt=salt;vaultSetupOpen=false;render();notify('Local encryption enabled. Save an encrypted backup.')}catch(err){notify('Encryption setup failed; existing data was preserved.')}}
function queueEncryptedSave(){const snapshot=JSON.stringify(state),currentKey=vaultKey,salt=vaultSalt;vaultWrite=vaultWrite.catch(()=>{}).then(async()=>{if(!currentKey||!salt)throw Error('Vault locked');localStorage.setItem(vaultStorageKey,await sealedSnapshot(snapshot,currentKey,salt))}).catch(()=>notify('Encrypted save failed. Do not close the page until resolved.'));return vaultWrite}
function save(){if(vaultKey){queueEncryptedSave();return}if(localStorage.getItem(vaultStorageKey)){notify('Tracker is locked. Unlock before editing.');return}try{localStorage.setItem(key,JSON.stringify(state))}catch{notify('Could not save in this browser')}}
async function lockVault(){await vaultWrite;vaultKey=null;vaultSalt=null;state=initial();drawer=null;render()}
async function downloadVault(){if(!vaultKey)return notify('Unlock the tracker first.');await vaultWrite;const data=localStorage.getItem(vaultStorageKey);if(!data)return notify('No encrypted backup found.');const blob=new Blob([data],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='nco-mission-control-encrypted-backup-'+today+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
async function restoreVaultFile(file){if(!file)return;try{const data=await file.text(),v=JSON.parse(data);if(!validVault(v))throw Error('Invalid encrypted backup');if(!confirm('Replace the current tracker with this encrypted backup? Your current local entries will be overwritten.'))return;await vaultWrite;localStorage.setItem(vaultStorageKey,data);localStorage.removeItem(key);vaultKey=null;vaultSalt=null;state=initial();drawer=null;render();notify('Backup imported. Enter its passphrase to unlock.')}catch(err){notify('Backup is not a supported encrypted NCO tracker file.')}}

function sol(id){return state.soldiers.find(s=>s.id===id)}function who(id){return sol(id)?.name||'Unassigned'}
function chip(s){let x=String(s).toLowerCase();let cls=/verified|completed|conducted/.test(x)?'green':/overdue|not enrolled|no-show|unsuccessful/.test(x)?'red':/pending|planned|requested|in review/.test(x)?'amber':'blue';return `<span class="chip ${cls}">${e(s)}</span>`}

.type)}${ev.soldierIds.length?' • '+ev.soldierIds.map(who).join(', '):''}</span></div><button class="text-button" data-act="event-detail" data-id="${ev.id}">Details ›</button></div>`).join(''):'<div class="empty">No commitments on the calendar today.</div>',`<button class="text-button" data-act="calendar">Full calendar ›</button>`)}${panel('Upcoming deadlines',due.length?due.map(x=>`<div class="list-row"><div class="circle">${ico(x.due<today?'alert':'clock')}</div><div class="row-main"><strong>${e(x.title)}</strong><span>${e(x.sub)}</span></div><div style="text-align:right">${chip(x.due<today?'Overdue':fmt(x.due))}<div style="margin-top:7px"><button class="text-button" data-act="${x.kind}-detail" data-id="${x.id}">Open ›</button></div></div></div>`).join(''):'<div class="empty">No deadlines in the next seven days.</div>')}</div><div class="stack">${panel('My follow-ups',actions.slice(0,4).map(t=>`<div class="list-row"><input class="check-task" type="checkbox" data-act="toggle-task" data-id="${t.id}" aria-label="Complete ${e(t.title)}"><div class="row-main"><strong>${e(t.title)}</strong><span>${who(t.soldierId)} • ${fmt(t.due)}</span></div><button class="text-button" data-act="task-detail" data-id="${t.id}">Open</button></div>`).join('')||'<div class="empty">No open follow-ups.</div>',`<button class="text-button" data-act="new-task">+ Add task</button>`)}${panel('Section focus',`<div class="mission-box"><div class="eyebrow">MISSION ESSENTIAL TASK</div><strong>45-CO-2218</strong><p>Produce Information Products</p><div class="progress"><div style="width:43%"></div></div><p style="margin-top:9px">Training coverage summary only, not an official readiness score.</p></div><div class="mission-box"><strong>Weekly development rhythm</strong><p>Tuesday: supporting collective tasks<br>Wednesday: supporting individual tasks</p></div><button class="text-button" data-act="goto" data-id="target">Explore MET readiness ›</button>`)}</div></div>`}

function soldiers(){let arr=state.soldiers.filter(s=>`${s.name} ${s.role}`.toLowerCase().includes(filter.toLowerCase()));const people=arr.map(s=>{let req=state.requirements.filter(x=>x.soldierId===s.id&&x.completion!=='Verified');let open=state.tasks.filter(x=>x.soldierId===s.id&&!x.done);let commitments=state.events.filter(v=>v.soldierIds.includes(s.id)&&v.date>=today).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));let next=[...req.map(r=>({label:r.course,date:r.due,kind:'Course due'})),...open.map(t=>({label:t.title,date:t.due,kind:'Follow-up'})),...commitments.map(v=>({label:v.title,date:v.date,kind:'Scheduled'}))].sort((a,b)=>a.date.localeCompare(b.date))[0];return `<button class="soldier soldier-large" data-act="soldier-detail" data-id="${s.id}"><div class="soldier-card-top"><span class="initials">${e(s.initials)}</span><span class="role-pill">${e(s.role)}</span></div><div class="soldier-card-name">${e(s.name)}</div><div class="small-meta">${s.reportsTo?'Reports to '+e(who(s.reportsTo)):'Section oversight'}</div><div class="soldier-next"><span class="soldier-caption">NEXT COMMITMENT / DEADLINE</span>${next?`<strong>${e(next.label)}</strong><span>${e(next.kind)} • ${fmt(next.date)}</span>`:'<strong>No upcoming items</strong><span>Nothing scheduled</span>'}</div><div class="soldier-card-bottom"><span>${req.length} open training</span><span>${open.length} follow-ups</span><span class="soldier-arrow">View profile ›</span></div></button>`}).join('');return heading('TEAM ACCOUNTABILITY','Your Section','Track Soldiers by rank and last name, then open each profile for appointments, training and follow-ups.',`<button class="btn primary" data-act="new-soldier">${ico('plus')} Add Soldier</button>`)+`${orgChart()}<div class="toolbar"><input class="search" id="search" aria-label="Search Soldiers" placeholder="Search Soldier or position..." value="${e(filter)}"/></div><div class="soldier-grid">${people}</div>${arr.length?'':'<div class="empty">No matching Soldiers s.length?'':'<div class="empty">No matching requirements.</div>'}</div><h2 class="section-head">Section training events</h2><div class="cards">${state.training.map(t=>`<div class="soldier"><div class="profile-top"><div class="initials">${ico('training')}</div><div><strong>${e(t.title)}</strong><span>${e(t.task)} • ${fmt(t.date)}</span></div></div><p class="small-meta">Instructor: ${e(t.instructor)}<br>Participants: ${t.participants.length} • ${e(t.status)}</p><button class="text-button" data-act="training-detail" data-id="${t.id}">View event ›</button></div>`).join('')}</div><div class="action-row"><button class="btn" data-act="task-library">${ico('note')} Supporting Task Library (18)</button></div>`}

 const base=dateAt(today);base.setDate(1);base.setMonth(base.getMonth()+calendarOffset);

ollow-up</button></div></div></details><details class="accordion"><summary>Production assignments (${missions.length})</summary><div>${missions.map(m=>`<div class="profile-item"><strong>${e(m.title)}</strong><span>Due ${fmt(m.due)}</span><button class="text-button" data-act="mission-detail" data-id="${m.id}">View mission</button></div>`).join('')||'No assignments'}</div></details>`}

ion}}save();drawer=null;render();notify('Saved to this browser')}

')}else if(a==='reset'){if(confirm('Clear all locally saved entries? This cannot be undone.')){state=initial();save();drawer=null;render();notify('Tracker cleared')}}});
document.addEventListener('change',ev=>{let el=ev.target;if(el.dataset.act==='prep-toggle'){let p=state.prepPlans.find(x=>x.id===el.dataset.id),item=p?.items.find(x=>x.id===el.dataset.item);if(item){item.done=el.checked;save();render();notify('Preparation requirement updated, course completion unchanged.')}return;}if(el.dataset.act==='toggle-task'){let t=state.tasks.find(t=>t.id===el.dataset.id);if(t){t.done=el.checked;save();render();notify('Task updated. Related training status was not changed.')}}});
document.addEventListener('input',ev=>{if(ev.target.id==='search'){filter=ev.target.value;let pos=ev.target.selectionStart;render();let target=document.querySelector('#search');target?.focus();target?.setSelectionRange(pos,pos)}});
function showWizardError(field,message){
 if(!field)return notify(message);
 const msg=document.createElement('p');msg.className='wizard-error';msg.setAttribute('role','alert');msg.textContent=message;
 field.closest('.field')?.appendChild(msg);
 field.setAttribute('aria-invalid','true');
 field.focus();
}
document.addEventListener('input',ev=>{if(ev.target.closest('#wizard-form')){ev.target.removeAttribute('aria-invalid');ev.target.closest('.field')?.querySelector('.wizard-error')?.remove();if(ev.target.hasAttribute('data-prep-mode')||ev.target.name.startsWith('itemdue'))updatePrepPreview(ev.target.closest('form'));}});
document.addEventListener('change',ev=>{if(ev.target.hasAttribute('data-prep-mode'))updatePrepPreview(ev.target.closest('form'));});
document.addEventListener('submit',ev=>{if(ev.target.id==='vault-setup-form'){ev.preventDefault();const f=Object.fromEntries(new FormData(ev.target).entries());if(f.pass!==f.confirm){notify('Passphrases do not match.');return;}createVault(f.pass);return;}if(ev.target.id==='vault-unlock-form'){ev.preventDefault();unlockVault(new FormData(ev.target).get('passphrase')||'');return;}if(ev.target.id==='wizard-form'){ev.preventDefault();let f=Object.fromEntries(new FormData(ev.target).entries());if(wizardStep===1){
 const nameField=ev.target.querySelector('[name="title"]');
 const dateField=ev.target.querySelector('[name="date"]');
 const title=(f.title||'').trim(), date=(f.date||'').trim();
 ev.target.querySelectorAll('.wizard-error').forEach(el=>el.remove());
 if(!title){showWizardError(nameField,'Enter a name for this training or event.');return;}
 if(!date||!/^\d{4}-\d{2}-\d{2}$/.test(date)||Number.isNaN(Date.parse(date))){showWizardError(dateField,'Select a valid start date.');return;}
 prepDraft={...prepDraft,title,type:f.type,soldierId:f.soldierId||'',date};wizardStep=2;render();
}
else if(wizardStep===2){prepDraft.hasPrep=f.hasPrep;if(f.hasPrep==='no'){state.prepPlans.push({id:idNew(),...prepDraft,items:[]});save();drawer=null;render();notify('Event saved without prerequisites');}else{wizardStep=3;render();}}
else{let items=Array.from({length:wizardRows},(_,i)=>{let mode=f['itemmode'+i]||'3',title=(f['itemtitle'+i]||'').trim(),due=prepDeadline(prepDraft.date,mode,f['itemdue'+i]||'');return {id:idNew(),title,mode,due,owner:f['itemowner'+i]||'NCO',done:false}}).filter(x=>x.title);if(!items.length){notify('Enter at least one prerequisite.');return;}if(items.some(x=>!x.due||x.due>prepDraft.date)){notify('Every requirement needs a deadline no later than the event.');return;}state.prepPlans.push({id:idNew(),...prepDraft,items});save();drawer=null;render();notify('Event and preparation checklist saved');}return;}
if(ev.target.id==='entity-form'){ev.preventDefault();formSave(ev.target)}});
document.addEventListener('change',ev=>{if(ev.target.id==='vault-file'){restoreVaultFile(ev.target.files?.[0]);}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&drawer){drawer=null;render()}});
document.addEventListener('click',ev=>{if(ev.target.id==='overlay'){drawer=null;render()}});
render();
</script>
</body>
</html>

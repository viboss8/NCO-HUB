/* AGSU-inspired Pinks and Greens theme, visual-only update for fictional demo. */
:root {
  --nav:#303b2d; --nav2:#46523b; --ink:#30372c; --muted:#766f61;
  --line:#ded7c8; --bg:#f5f1e8; --white:#fffdf8;
  --blue:#536746; --blue-soft:#ebefe4; --teal:#617851;
  --amber:#986d27; --red:#a44c43;
  --shadow:0 5px 22px rgba(51,54,38,.055);
}
body {background:var(--bg); color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible {outline-color:#b49a60}
.sidebar {background:linear-gradient(165deg,#303b2d 0%,#37442f 55%,#252f25 100%);color:#e9e4d7}

.sidebar-bottom {border-color:#687259}
.demo-label {border-color:#a49a72;color:#f0dfb5}
.sidebar-bottom p {color:#d0c9b3}
.topbar,.metric,.panel,.soldier,.met-card,.mission-card,.day-card,.tab,.btn,.search,.select {background:#fffdf9}
.topbar,.panel-head,.data-table td,.data-table th,.row-event,.list-row {border-color:var(--line)}
.crumb,.heading p,.panel-head small {color:var(--muted)}
.crumb strong,.btn,.time {color:#394634}

const icons={home:'<path d="m3 10 9-7 9 7v11h-6v-7H9v7H3z"/>',users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',training:'<path d="m2 10 10-6 10 6-10 6zM6 12v5c3.5 3 8.5 3 12 0v-5M22 10v7"/>',target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',missions:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M7 5l3 5M13 5l3 5M9 14l6 3-6 3z"/>',tasks:'<path d="m4 7 2 2 4-4M13 7h8M4 17l2 2 4-4M13 17h8"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 11h18"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 2"/>',alert:'<circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 17h.01"/>',plus:'<path d="M12 4v16M4 12h16"/>',check:'<path d="m4 12 5 5L20 6"/>',brief:'<rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V4h8v3M3 13h18"/>',arrow:'<path d="m9 18 6-6-6-6"/>',shield:'<path d="m12 2 9 4v6c0 5-3 8-9 10-6-2-9-5-9-10V6z"/><path d="m8 12 3 3 5-6"/>',filter:'<path d="M3 5h18M7 12h10M10 19h4"/>',note:'<path d="M4 3h16v18H4zM8 8h8M8 13h8"/>'};
function ico(n){return `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[n]||icons.note}</svg>`}
const nav=[['home','Home'],['soldiers','Soldiers'],['calendar','Calendar'],['training','Training'],['tasks','My Tasks'],['missions','Missions'],['met','MET Readiness']];
const iso=d=>{let x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};
const addDay=(days)=>{let d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+days);return iso(d)};
const today=addDay(0);

const JBLM_DONSA={'2026-11-27':'JBLM DONSA','2026-12-24':'JBLM DONSA','2026-12-31':'JBLM DONSA','2027-01-15':'JBLM DONSA','2027-02-12':'JBLM DONSA','2027-05-28':'JBLM DONSA'};
const dateAt=s=>new Date(s+'T12:00:00');
const dateKey=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
const observed=d=>{let x=new Date(d);if(x.getDay()===6)x.setDate(x.getDate()-1);else if(x.getDay()===0)x.setDate(x.getDate()+1);return dateKey(x)};

function federalHolidays(year){
 let out={};const add=(day,name)=>{out[day]=name};
 for(const y of [year-1,year,year+1]){
  [[0,1,"New Year's Day"],[5,19,"Juneteenth"],[6,4,"Independence Day"],[10,11,"Veterans Day"],[11,25,"Christmas Day"]].forEach(([m,d,name])=>{let day=observed(new Date(y,m,d,12));if(day.startsWith(String(year)))add(day,name)});
  if(y===year){add(nthWeekday(y,0,1,3),"Martin Luther King Jr. Day");add(nthWeekday(y,1,1,3),"Washington's Birthday");add(lastWeekday(y,4,1),"Memorial Day");add(nthWeekday(y,8,1,1),"Labor Day");add(nthWeekday(y,9,1,2),"Columbus Day");add(nthWeekday(y,10,4,4),"Thanksgiving Day")}
 }

}

function eightSuggestedDeadline(eventDate,leadDays){
 const preferred=workingDaysBefore(eventDate,leadDays);
 const days=[];
 let d=dateAt(today),end=dateAt(eventDate);
 // A short-notice event has fewer working days than the recommended lead time.
 // Distribute suggestions across remaining workdays before the event; never suggest a past date.
 while(d<end&&days.length<370){if(isWorkingDay(dateKey(d)))days.push(dateKey(d));d.setDate(d.getDate()+1)}
 if(!days.length)return today;
 const maxLead=8;
 if(days.length>=maxLead)return preferred;
 const position=Math.round((maxLead-Math.min(maxLead,Math.max(1,leadDays)))/(maxLead-1)*(days.length-1));
 return days[Math.max(0,Math.min(days.length-1,position))];
}
function eightLeadDays(t){
 if(Number(t.leadDays)>0)return Number(t.leadDays);
 const id=t.id||'';
 if(id==='eight-facility-request')return 8;
 if(id==='eight-instructor-request')return 7;
 if(id==='eight-draw')return 3;
 if(id==='eight-brief')return 2;
 if(id==='eight-rehearse')return 1;
 if(t.custom)return 2;
 const question=eightStepQuestions.find(q=>'eight-'+q.id===id);
 return question?.before||0;
}
function eightNormalizeDraftDeadlines(p){
 // Existing unapproved drafts may retain deadlines from the earlier planner,
 // including dates in the past. Never alter approved calendar records.
 if(p.status==='Active'||!p.date)return;
 for(const t of p.tasks||[]){
  const lead=eightLeadDays(t);
  if(!lead)continue;
  if(!t.leadDays)t.leadDays=lead;
  if(!t.due||t.due<today){
   t.due=eightSuggestedDeadline(p.date,lead);
   t.dateAdjusted=true;
  }
 }
}
function eightDeadlineNote(t,p){
 const lead=eightLeadDays(t);
 if(!lead)return '';
 const ideal=workingDaysBefore(p.date||addDay(14),lead);
 const shortened=ideal<today;
 return shortened?'<span class="small-meta eight-deadline-help">Short-notice schedule: suggested date adjusted to remaining workdays.</span>':'';
}
function eightCreateTasks(p){
 const defaultOwner=p.lead?.trim()||'Training lead';
 const tasks=eightStepQuestions.filter(q=>eightCurrentAnswer(p,q.id)!=='no').map(q=>({
  id:'eight-'+q.id,title:eightCurrentAnswer(p,q.id)==='unsure'?'Clarify: '+q.label:q.task,
  due:eightSuggestedDeadline(p.date||addDay(14),q.before),leadDays:q.before,owner:defaultOwner,done:false,step:q.step,included:true
 }));
 for(const kind of ['facility','instructor']){
  if(eightCurrentAnswer(p,kind)!=='yes')continue;
  const isFacility=kind==='facility';
  const request=p.answers?.[kind+'Request']||'no';
  const confirmation=p.answers?.[kind+'Confirmed']||'no';
  const existing=tasks.find(x=>x.id==='eight-'+kind);
  if(existing){
   existing.title=isFacility?'Receive facility / training location confirmation':'Receive instructor / cadre confirmation';
   existing.done=confirmation==='yes';
  }
  tasks.push({id:'eight-'+kind+'-request',
   title:isFacility?'Submit facility / training location request':'Contact instructor / cadre (call or email)',
   due:eightSuggestedDeadline(p.date||addDay(14),isFacility?8:7),leadDays:isFacility?8:7,
   owner:defaultOwner,done:request==='yes',step:isFacility?3:2,included:true
  });
 }
 if(eightCurrentAnswer(p,'safety')==='yes'&&p.answers?.draw!=='yes')tasks.push({
  id:'eight-draw',title:p.answers?.draw==='unsure'?'Confirm whether DRAW is complete':'Complete DRAW (Deliberate Risk Assessment Worksheet)',
  due:eightSuggestedDeadline(p.date||addDay(14),3),leadDays:3,owner:defaultOwner,done:false,step:1,included:true
 });
 tasks.push(
  {id:'eight-brief',title:'Issue training instructions / brief participants',due:eightSuggestedDeadline(p.date||addDay(14),2),leadDays:2,owner:defaultOwner,done:false,step:4,included:true},
  {id:'eight-rehearse',title:'Rehearse and verify readiness',due:eightSuggestedDeadline(p.date||addDay(14),1),leadDays:1,owner:defaultOwner,done:false,step:5,included:true}
 );
 return tasks;
}

function removeDemoTrainingData(){
 const demoPlans=state.trainingPlans.filter(p=>p.demo===true);
 const planIds=new Set(demoPlans.map(p=>p.id));
 const eventIds=new Set(demoPlans.map(p=>p.trainingId).filter(Boolean));
 const prepIds=new Set(demoPlans.map(p=>p.prepPlanId).filter(Boolean));
 for(const event of state.training){
  if(event.demo===true||planIds.has(event.planId))eventIds.add(event.id);
 }
 const cleanup=[
  ['trainingPlans',p=>p.demo===true],
  ['training',t=>eventIds.has(t.id)],
  ['prepPlans',p=>p.demo===true||prepIds.has(p.id)||planIds.has(p.eightPlanId)||eventIds.has(p.trainingId)],
  ['events',event=>event.demo===true]
 ];
 let changed=false;
 for(const [collection,isDemo] of cleanup){
  const records=state[collection];
  const kept=records.filter(record=>!isDemo(record));
  if(kept.length===records.length)continue;
  state[collection]=kept;
  changed=true;
 }
 if(changed)save();
}

function eightSaveStep(form,p,step){

  p.title=f.title.trim().slice(0,160);p.date=f.date;p.time=f.time||'09:00';

  p.participantScope=scope;p.participantOther=scope==='Other'?(f.participantOther||'').trim().slice(0,120):'';
  if(scope==='Other'&&!p.participantOther){notify('Enter who is participating when you choose Other.');return false}
  p.who=scope==='Other'?p.participantOther:scope;p.where=f.where||'';

 }else if(step===2){
  const old=Object.fromEntries((p.tasks||[]).map(x=>[x.id,x]));
  for(const q of eightStepQuestions)p.answers[q.id]=f['q_'+q.id]||eightAnswerDefault(q.id);
  p.answers.draw=p.answers.safety==='yes'?(f.q_draw||'no'):'not-applicable';
  for(const kind of ['facility','instructor'])for(const suffix of ['Request','Confirmed'])p.answers[kind+suffix]=p.answers[kind]==='yes'?(f['q_'+kind+suffix]||'no'):'not-applicable';
  p.tasks=[...eightCreateTasks(p).map(x=>{
   const previous=old[x.id];
   // Preserve manually adjusted future dates, but never reuse stale past suggestions.
   const keepDate=previous?.due&&previous.due>=today&&previous.due<=p.date&&previous.dateAdjusted!==true;
   return {...x,...(previous||{}),title:x.title,
     due:keepDate?previous.due:x.due,leadDays:x.leadDays,
     dateAdjusted:!keepDate,done:previous?.done===true||x.done===true,
     owner:previous?.owner||x.owner};
  }),...(p.tasks||[]).filter(x=>x.custom)];
  eightNormalizeDraftDeadlines(p);
 }else if(step===3){
  for(const t of p.tasks||[]){
   if(t.custom)t.title=(f['title_'+t.id]||t.title).trim().slice(0,140);

   const updatedDue=f['due_'+t.id]||t.due;

   t.due=updatedDue;
   if(t.included&&(!t.due||t.due>p.date)){notify('Choose preparation deadlines on or before the training date.');return false}

 if(state.trainingPlans.some(x=>x.id===p.id))save();return true;

start date');return}upsert('events',{id:id||idNew(),title:f.title,date:f.date,endDate:eventEnd,time:f.time,type:f.type,detail:f.detail,soldierIds:f.soldierId?[f.soldierId]:[],status:'Scheduled'})}else if(kind==='counseling'){if(!f.soldierId||!sol(f.soldierId)||!/^\d{4}-\d{2}-\d{2}$/.test(f.date||'')||f.date>today){notify('Choose a Soldier and a completed date not in the future.');return}upsert('counselings',{id:id||idNew(),soldierId:f.soldierId,date:f.date,counselorId:f.counselorId||''})}else if(kind==='mission'){upsert('missions',{id:id||idNew(),title:f.title,owner:f.soldierId,due:f.due,deliverable:f.deliverable,stage:['Assigned','Planning','In Production','In Review','Completed'].indexOf(f.stage),detail:f.detail})}else if(kind==='training'){
 const endDate=f.endDate||f.date;if(!f.title?.trim()||!f.date||!f.time||endDate<f.date){notify('Enter a training title, date and time.');return}

 const instructorId=f.instructorId||'',outsideInstructor=(f.outsideInstructor||'').trim();
 upsert('training',{...old,id:id||idNew(),title:f.title.trim(),date:f.date,endDate,time:f.time,
 instructorId,outsideInstructor,instructor:instructorId?who(instructorId):outsideInstructor,

 for(const p of state.prepPlans.filter(p=>p.trainingId===(id||''))){p.date=f.date;p.endDate=endDate;p.title=f.title.trim()+' • Preparation';}

function validateRosterDoc(doc){
 if(!doc||doc.format!=='nco-hub-roster-v1'||!Array.isArray(doc.soldiers)||doc.soldiers.length===0||doc.soldiers.length>100)throw Error('Invalid roster format');
 const ids=new Set();
 const records=doc.soldiers.map(raw=>{
  if(!raw||typeof raw!=='object')throw Error('Invalid Soldier record');
  const id=String(raw.id||'').trim(),rank=String(raw.rank||'').trim(),last=String(raw.lastName||'').trim(),first=String(raw.firstName||'').trim(),role=String(raw.role||'').trim();
  if(!/^[a-zA-Z0-9_-]{1,40}$/.test(id)||ids.has(id)||!/^[A-Za-z0-9 ]{2,8}$/.test(rank)||!/^[A-Za-z][A-Za-z' -]{0,59}$/.test(last)||first.length>60||role.length>100)throw Error('Invalid or duplicate Soldier record');
  ids.add(id);
  return {id,rank,lastName:last,firstName:first,role,reportsTo:raw.reportsTo==null?null:String(raw.reportsTo),name:rank+' '+last,initials:last[0].toUpperCase(),goals:[]};
 });
 if(records.some(x=>x.reportsTo&&!ids.has(x.reportsTo)))throw Error('Reporting line references missing Soldier');
 for(const soldier of records){const seen=new Set([soldier.id]);let current=soldier;while(current.reportsTo){if(seen.has(current.reportsTo))throw Error('Circular reporting structure');seen.add(current.reportsTo);current=records.find(x=>x.id===current.reportsTo);if(!current)break}}
 return records;
}
function mergeRoster(records,sync=false){
 const existing=state.soldiers,used=new Set(existing.map(x=>x.id)),ids=new Map();
 records.forEach(r=>{
  const match=existing.find(x=>x.rank.toUpperCase()===r.rank.toUpperCase()&&(x.lastName||x.name.split(' ').slice(1).join(' ')).toUpperCase()===r.lastName.toUpperCase());
  const id=match?.id||(!used.has(r.id)?r.id:idNew());used.add(id);ids.set(r.id,id);
 });
 records.forEach(r=>{
  const id=ids.get(r.id),old=existing.find(x=>x.id===id);
  upsert('soldiers',{...r,id,active:true,reportsTo:r.reportsTo?ids.get(r.reportsTo)||null:null,firstName:r.firstName||old?.firstName||'',goals:old?.goals||[]});
 });
 let archived=0;
 if(sync){
  const activeIds=new Set(ids.values());
  for(const soldier of existing){
   if(!activeIds.has(soldier.id)&&soldier.active!==false){soldier.active=false;archived++;}
  }
 }
 save();render();return {imported:records.length,archived};
}
async function importRosterFile(file){
 if(!file)return;
 try{
  if(file.size>100000)throw Error('Roster import file too large');
  const doc=JSON.parse(await file.text()),records=validateRosterDoc(doc),sync=doc.syncActiveRoster===true;
  if(!confirm('Import '+records.length+' Soldier profiles and reporting relationships? '+(sync?'Other team members will be archived from active views, not deleted. ':'')+'Existing linked tasks and appointments will be preserved.'))return;
  const result=mergeRoster(records,sync);
  notify(result.imported+' Soldier profiles updated; '+result.archived+' former team members archived');
 }catch(err){notify(err.message||'Roster import failed')}
}

document.addEventListener('click',ev=>{let el=ev.target.closest('[data-act]');if(!el)return;let a=el.dataset.act,id=el.dataset.id;if(el.type==='checkbox')return;if(a==='soldier-work'){expandedSoldierId=expandedSoldierId===id?'':id;render()}else if(a==='goto')route(id);else if(a==='calendar')route('calendar');else if(a==='met-summary'){if(id==='library'){open('library','')}else{metFilter=['all','trained','evaluated'].includes(id)?id:'all';render();document.getElementById('met-measure-list')?.scrollIntoView({behavior:'smooth',block:'start'})}}else if(a==='metric-open'){if(id==='soldiers'){route('soldiers')}else{document.getElementById(id)?.scrollIntoView({behavior:'smooth',block:'start'})}}else if(a==='calendar-week'){calendarView='week';render()}else if(a==='calendar-month'){calendarView='month';render()}else if(a==='week-prev'){weekOffset--;render()}else if(a==='week-next'){weekOffset++;render()}else if(a==='week-now'){weekOffset=0;render()}else if(a==='calendar-day'){const d=dateAt(id),current=dateAt(today);const monday=x=>{let a=new Date(x);a.setDate(a.getDate()-((a.getDay()+6)%7));return a};weekOffset=Math.round((monday(d)-monday(current))/604800000);calendarView='week';render()}else if(a==='month-prev'){calendarOffset--;render()}else if(a==='month-next'){calendarOffset++;render()}else if(a==='month-now'){calendarOffset=0;render()}else if(a==='vault-setup'){if(localStorage.getItem(vaultStorageKey)){notify('An encrypted tracker is already configured. Use Encrypted Backup or Lock instead.');return;}vaultSetupOpen=true;render()}else if(a==='vault-cancel'){vaultSetupOpen=false;render()}else if(a==='vault-lock'){lockVault()}else if(a==='vault-backup'){downloadVault()}else if(a==='vault-restore'){document.getElementById('vault-file')?.click()}else if(a==='close'){discardTransientEight();drawer=null;render()}else if(a==='tab'){tab=id;render()}else if(a==='eight-new'){const p=eightPlanDraft();eightStepScreen=1;open('eight-plan',p.id)}else if(a==='eight-delete'){const p=e il')open('counseling',id);else if(a==='counseling-delete'){if(confirm('Delete this counseling date record?')){state.counselings=state.counselings.filter(x=>x.id!==id);save();drawer=null;render();notify('Counseling record deleted')}}else if(a==='training-config')open('training-config','');else if(a==='training-prep-add')open('training-prep',id);else if(a==='training-block-prev'){trainingBlockOffset--;render()}else if(a==='training-block-next'){trainingBlockOffset++;render()}else if(a==='training-block-current'){trainingBlockOffset=0;render()}else if(a==='training-week-add'){const day=dateAt(id);day.setDate(day.getDate()+1);trainingDatePreset=dateKey(day);open('training','')}else if(a==='training-delete'){if(confirm('Delete this training event? Its linked preparation tasks will also be removed.')){state.training=state.training.filter(x=>x.id!==id);state.prepPlans=state.prepPlans.filter(x=>x.trainingId!==id);save();drawer=null;render();notify('Training event deleted')}}else if(a==='training-prep-remove'){if(confirm('Remove this preparation task?')){let p=state.prepPlans.find(x=>x.id===id);if(p){p.items=p.items.filter(x=>x.id!==el.dataset.item);save();render();notify('Preparation task removed')}}}else if(a==='absence-delete'){if(confirm('Delete this Leave / Pass entry?')){state.absences=state.absences.filter(x=>x.id!==id);save();drawer=null;render();notify('Entry deleted')}}else if(a==='mission-detail')open('mission',id);else if(a==='met-detail')open('met',id);else if(a==='task-library')open('library');else if(a==='prep-detail')open('prep',id);else if(a==='prep-edit')open('prep-edit',id);else if(a==='quick-add'){createFor=sol(id)?id:'';quickCategory='task';open('quick-add','')}else if(a==='quick-start-wizard'){prepDraft={};wizardStep=1;wizardRows=1;open('prep-wizard','')}else if(a==='quick-start-training'){createFor='';open('training','')}else if(a==='quick-start-absence'){createFor='';open('absence','')}else if(a==='quick-start-counseling'){createFor='';open('counseling','')}else if(a==='new-prep'){createFor=sol(id)?id:'';prepDraft={};wizardStep=1;wizardRows=1;open('prep-wizard','')}else if(a==='wizard-back'){wizardStep=Math.max(1,wizardStep-1);render()}else if(a==='wizard-add'){let form=document.querySelector('#wizard-form');if(form)prepDraft.items=wizardDraftRows(form);wizardRows=Math.min(wizardRows+1,10);render()}else if(a.startsWith('new-')){createFor=sol(id)?id:'';open(a.slice(4),'')}else if(a==='suggest-task'){upsert('tasks',{id:idNew(),title:'Verify training attendance',due:addDay(3),soldierId:'',done:false,note:'Created manually from a suggested follow-up',source:'manual'});save();render();notify('Follow-up added')}else if(a==='reset'){if(confirm('Clear all locally saved entries? This cannot be undone.')){state=initial();save();drawer=null;render();notify('Tracker cleared')}}});
